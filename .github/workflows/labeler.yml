name: "Pull Request Labeler (VULNERABLE)"
on: pull_request_target

permissions:
  contents: write          # ⚠️ خطير
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}   # ⚠️ يسحب كود المهاجم
        repository: ${{ github.event.pull_request.head.repo.full_name }}

    - uses: actions/labeler@v5
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
        sync-labels: true

    - name: Install & Test
      run: |
        npm install    # ⚠️ ينفذ postinstall من الـ fork
        npm test       # ⚠️ ينفذ test scripts من الـ fork
